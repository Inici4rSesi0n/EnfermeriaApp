<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRP EXPRESS - Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/all.css">
</head>
<body>
    <main class="login-wrapper" style="justify-content: center;">
        <div class="login-form-container" style="max-width: 500px;">
            <header style="margin-bottom: 2rem; text-align: center;">
                <h1 style="font-size: 2rem; color: var(--primary); margin-bottom: 0.5rem;">Crear Cuenta</h1>
                <p style="font-size: 0.95rem;">Únete al sistema de vigilancia del sarampión</p>
            </header>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="name">NOMBRE COMPLETO</label>
                    <input type="text" id="name" name="name" placeholder="Ej. Ana García" required>
                </div>
                <div class="form-group">
                    <label for="dni">DNI</label>
                    <input type="text" id="dni" name="dni" placeholder="8 dígitos" maxlength="8" required>
                </div>
                <div class="form-group">
                    <label for="phone">N° TELÉFONO</label>
                    <input type="tel" id="phone" name="phone" placeholder="Ej. 999888777" maxlength="9" required>
                </div>
                <div class="form-group">
                    <label for="email">CORREO ELECTRÓNICO</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="form-group">
                    <label for="password">CONTRASEÑA</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div id="errorMessage" class="alert alert-error"></div>

                <button type="submit" id="btnSubmit" class="btn btn-primary btn-full">
                    Registrarse
                </button>
                <div style="text-align: center; margin-top: 1.5rem;">
                    <a href="./login.html" style="color: var(--primary-light); font-size: 0.9rem;">¿Ya tienes cuenta? Inicia sesión</a>
                </div>
            </form>
        </div>
    </main>
    <script type="module" src="./js/register.js"></script>
</body>
</html>
