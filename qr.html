<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRP EXPRESS - Código QR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/all.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div class="login-form-container" style="max-width: 450px; text-align: center; padding: 2.5rem;">
        <h1 style="font-size: 1.8rem; color: var(--primary); margin-bottom: 0.5rem;">Acceso Rápido</h1>
        <p style="font-size: 0.9rem; font-weight: 500; letter-spacing: 1px; margin-bottom: 2rem; text-transform: uppercase;">Escanea o descarga</p>

        <div id="qrcode" style="background: white; padding: 15px; display: inline-block; border-radius: 12px; margin-bottom: 2rem; border: 1px solid var(--border-glass); box-shadow: var(--shadow-sm);"></div>

        <div class="form-group" style="margin-bottom: 2rem;">
            <input type="text" id="urlInput" value="https://inici4rsesi0n.github.io/EnfermeriaApp/" readonly style="text-align: center; font-size: 0.8rem; background: transparent; border: none; border-bottom: 1px solid var(--border-glass); border-radius: 0; padding: 0.5rem;">
        </div>

        <button id="btnDownload" class="btn btn-primary btn-full" style="margin-bottom: 1rem;">
            Descargar Póster (PNG)
        </button>

        <a href="./index.html" class="btn btn-outline btn-full">
            Volver al Inicio
        </a>
    </div>
    <script type="module" src="./js/qrMain.js"></script>
</body>
</html>
