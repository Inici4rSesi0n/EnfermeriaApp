<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRP EXPRESS - Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/all.css">
</head>
<body style="display: flex; align-items: center; justify-content: center;">
    <main class="login-wrapper">
        <div class="login-left">
            <div class="login-form-container">
                <header style="margin-bottom: 2rem; text-align: center;">
                    <h1 style="font-size: 2rem; color: var(--primary); margin-bottom: 0.5rem;">Iniciar Sesión</h1>
                    <p style="font-size: 0.95rem;">Ingresa tu DNI para continuar</p>
                </header>

                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="dni">DNI</label>
                        <input type="text" id="dni" name="dni" placeholder="Ingresa tu DNI" maxlength="8" required>
                    </div>
                    <div class="form-group">
                        <label for="password">CONTRASEÑA</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <div id="errorMessage" class="alert alert-error"></div>

                    <button type="submit" id="btnSubmit" class="btn btn-primary btn-full">
                        Entrar al Sistema
                    </button>
                    <div style="text-align: center; margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem;">
                        <a href="./register.html" style="color: var(--primary-light); font-size: 0.9rem;">¿No tienes cuenta? Regístrate aquí</a>
                        <a href="./index.html" style="color: var(--text-muted); font-size: 0.9rem;">← Volver al inicio</a>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="login-right">
            <img src="https://images.unsplash.com/photo-1579684385127-1ef15d508118?q=80&w=2000&auto=format&fit=crop" alt="Enfermera" class="login-bg-image">
            <div class="login-overlay"></div>
            <div class="brand-panel">
                <svg class="brand-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 5L93.3013 27.5V72.5L50 95L6.69873 72.5V27.5L50 5Z" stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="rgba(255,255,255,0.05)"/>
                    <text x="50" y="56" font-family="Outfit, sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2">SRP</text>
                    <path d="M25 72H40L45 64L50 78L55 70H75" stroke="#D489FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h2 class="brand-title">SRP EXPRESS</h2>
                <p class="brand-quote">"Salvando vidas - SAN ROMÁN"</p>
            </div>
        </div>
    </main>
    <script type="module" src="./js/login.js"></script>
</body>
</html>
